# DAPE-MA Laravel — HTTPS-only Nginx (port 443)
# Network policy: port 80 is not allowed. SSL certs already on the server.
#
# Install:
#   sudo cp deploy/nginx-dape-ma-ssl.conf /etc/nginx/sites-available/dape-ma
#   # OR edit SSL paths below, then:
#   sudo bash deploy/apply-nginx-ssl.sh
#
# Confirm certificate filenames under /etc/ssl/certs (and key under /etc/ssl/private).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dapemade.ddb.gov.ph;

    # --- SSL (adjust filenames to match what Network Admin uploaded) ---
    ssl_certificate     /etc/ssl/certs/dapemade.ddb.gov.ph.crt;
    ssl_certificate_key /etc/ssl/private/dapemade.ddb.gov.ph.key;
    # If they uploaded a full chain + key as .pem:
    # ssl_certificate     /etc/ssl/certs/dapemade.ddb.gov.ph.fullchain.pem;
    # ssl_certificate_key /etc/ssl/private/dapemade.ddb.gov.ph.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/dape-ma-laravel/public;
    index index.php;

    charset utf-8;
    client_max_body_size 14M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        # Sanctum Bearer tokens
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/dape-ma-access.log;
    error_log  /var/log/nginx/dape-ma-error.log;
}

# Port 80 intentionally omitted — Network Admin does not allow HTTP.
